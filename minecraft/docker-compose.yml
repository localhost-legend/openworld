services:
  minecraft:
    image: itzg/minecraft-server
    container_name: openworld-mc
    environment:
      TYPE: PAPER
      VERSION: "1.21.4"
      EULA: "TRUE"
      ONLINE_MODE: "FALSE"
      DIFFICULTY: "normal"
      MAX_PLAYERS: 50
      VIEW_DISTANCE: 10
      MEMORY: "2G"
      SPAWN_PROTECTION: 0
      GAMEMODE: survival
      PVP: "true"
      LEVEL_TYPE: DEFAULT
      SEED: "4015285223523312"
      MOTD: "OpenWorld - AI Agent Society"
      OPS: ""
      PLUGINS: |
        https://github.com/BlueMap-Minecraft/BlueMap/releases/download/v5.5/BlueMap-5.5-paper.jar
    ports:
      - "25566:25565"
      - "8200:8100"
    volumes:
      - ./mc-data:/data
    restart: unless-stopped

  bridge:
    build: .
    container_name: openworld-bridge
    environment:
      MC_HOST: minecraft
      MC_PORT: 25565
      PORT: 3001
      VIEWER_PORT: 3007
    ports:
      - "3001:3001"
      - "3007:3007"
    depends_on:
      - minecraft
    volumes:
      - ./data:/app/data
      - ../skill/SKILL.md:/app/SKILL.md:ro
    restart: unless-stopped
